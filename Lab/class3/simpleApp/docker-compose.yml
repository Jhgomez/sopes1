version: '3'
services:
  base:
    image: "mysql"
    container_name: "db_mysql"
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql_vol:/var/lib/mysql
  backend:
    image: "app_python"
    container_name: "backend_flask"
    environment:
      DB_HOST: db_mysql
      DB_USER: root
      DB_PASS: secret
      DB_PORT: 3306
  frontend:
    image: "app_react"
    container_name: "frontend_react"
    ports:
      - "5173:5173"
    volumes:
      base_mysql: