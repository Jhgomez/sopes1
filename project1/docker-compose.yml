services:
  backend:
    # build:
    #   context: ./RESTServer
    #   dockerfile: Dockerfile
    image: juan523/monitorapi
    ports:
      - "8080:8080"
    environment:
      DB_HOST: ldb
      DB_NAME: monitor
      DB_USER: monitor
      DB_PASSWORD: monitor
      DB_PORT: 33060
    container_name: 'lnode'
    restart: always
    depends_on: 
      - data

  data:
    # build:
    #   context: ./db
    #   dockerfile: Dockerfile
    image: juan523/monitordb
    ports:
      - "33060:33060"
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: monitor
      MYSQL_DATABASE: monitor
      MYSQL_USER: monitor
      MYSQL_PASSWORD: monitor
    volumes:
      - mysql:/var/lib/mysql      
    container_name: 'ldb'
    restart: always
  
  monitor:
    # build:
    #   context: ./monitorAgent
    image: juan523/monitoragent
    ports:
      - "3000:3000"
    privileged: true
    environment:
      HOST: lnode
    volumes:
      - /proc:/proc
    restart: always
    depends_on:
      - backend
      - data

volumes:
  mysql: 