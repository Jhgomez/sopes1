apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: project-ingress
  namespace: project
  annotations:
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST"
spec:
  ingressClassName: nginx
  rules:
    - host: 34.58.126.96.nip.io
      http:
        paths:
          - pathType: Prefix
            backend:
              service:
                name: d-api-rest-grpc-service
                port:
                  number: 80
            path: /