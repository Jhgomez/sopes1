apiVersion: v1
kind: ConfigMap
metadata:
  name: sopes-redis-config
  namespace: project
data:
  redis-config: |
    loadmodule /usr/local/lib/redis/modules/redisbloom.so
    loadmodule /usr/local/lib/redis/modules/redisearch.so
    loadmodule /usr/local/lib/redis/modules/redistimeseries.so
    loadmodule /usr/local/lib/redis/modules/rejson.so

    user sopes on +@admin allcommands allkeys allchannels >sopes
    requirepass sopes
# got configurations from here
# https://redis.io/docs/latest/operate/oss_and_stack/management/config-file/
# https://redis.io/docs/latest/commands/acl-setuser/